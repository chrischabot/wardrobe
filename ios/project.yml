# XcodeGen spec for the Garderobe iOS app. `Garderobe.xcodeproj` is generated from this file:
#   xcodegen generate --spec project.yml   (run in garderobe/ios)
name: Garderobe
options:
  bundleIdPrefix: app.garderobe
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    # Signing is left to the owner's Apple developer account (not configured here).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Empty = demo mode on bundled fixtures. Set to the deployed Worker URL for live use.
    GARDEROBE_API_BASE_URL: ""
packages:
  Garderobe:
    path: .
targets:
  Garderobe:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Garderobe
        product: GarderobeKit
      - package: Garderobe
        product: GarderobeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.garderobe.ios
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  GarderobeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Garderobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.garderobe.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Garderobe
schemes:
  Garderobe:
    build:
      targets:
        Garderobe: all
        GarderobeUITests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-GarderobeDemo": true
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GarderobeUITests
        - package: Garderobe/GarderobeKitTests
